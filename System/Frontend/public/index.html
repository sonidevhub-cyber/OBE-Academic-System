<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link id="favicon" rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/logo2.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo512.png" />
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5b2fc1" />
    <meta
      name="description"
      content="OBE Academic System - Outcome-Based Education management and assessment platform for modern academic institutions."
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>OBE Academic System</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run OBE Academic System.</noscript>
    <div id="root"></div>
    <script>
      (function () {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () {
          var size = Math.min(img.width, img.height, 128);
          var canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, size, size);
          ctx.save();
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2, true);
          ctx.closePath();
          ctx.clip();
          var scale = Math.max(size / img.width, size / img.height);
          var w = img.width * scale;
          var h = img.height * scale;
          var ox = (size - w) / 2;
          var oy = (size - h) / 2;
          ctx.drawImage(img, ox, oy, w, h);
          ctx.restore();
          try {
            var dataUrl = canvas.toDataURL('image/png');
            var fav = document.getElementById('favicon');
            if (fav) fav.href = dataUrl;
            var touch = document.querySelector('link[rel="apple-touch-icon"]');
            if (touch) touch.href = dataUrl;
            var links = document.querySelectorAll('link[rel="icon"]');
            for (var i = 0; i < links.length; i++) {
              links[i].href = dataUrl;
            }
          } catch (e) {}
        };
        img.onerror = function () {};
        img.src = '%PUBLIC_URL%/logo2.png';
      })();
    </script>
  </body>
</html>
